<svg xmlns="http://www.w3.org/2000/svg" viewBox="72 72 288 288" role="img" aria-label="Tamsi">
  <!-- The Tamsi launcher icon, drawn from scripts/brand/render_tamsi_icon.py's spec (QJ-372): the visible
       72..360 area of the 108 dp adaptive canvas, grey tile, "Gradient glow" dot and line. -->
  <defs>
    <linearGradient id="dot" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F29A6B"/><stop offset="1" stop-color="#CF5534"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4FB3D9"/><stop offset="1" stop-color="#2370A0"/></linearGradient>
    <filter id="dotGlow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#D76741" flood-opacity=".3"/></filter>
    <filter id="lineGlow" x="-20%" y="-80%" width="140%" height="260%"><feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#2B88AB" flood-opacity=".3"/></filter>
  </defs>
  <rect x="72" y="72" width="288" height="288" rx="64" fill="#EEF3F6"/>
  <circle cx="216" cy="185.2" r="23.8" fill="url(#dot)" filter="url(#dotGlow)"/>
  <rect x="113.5" y="242.5" width="205" height="28" rx="14" fill="url(#line)" filter="url(#lineGlow)"/>
</svg>
